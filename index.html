<!DOCTYPE html><html lang="ro"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier de prompturi</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f3;color:#183831;font:16px/1.55 system-ui}header{background:#123e36;color:white;padding:38px max(5vw,20px)}h1{font:600 clamp(34px,5vw,65px)/1.1 Georgia;margin:8px 0}header p{color:#c4e6db;margin:12px 0}main{max-width:1500px;margin:auto;padding:26px 5vw}section{display:flex;gap:14px;flex-wrap:wrap}label{flex:1;min-width:180px;font-weight:600}select,input{display:block;width:100%;padding:12px;margin-top:4px;border:1px solid #9cafa8;border-radius:7px;background:white;font:inherit}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:18px}article{background:white;border:1px solid #cddcd5;border-top:4px solid #29816e;border-radius:12px;padding:22px;display:flex;flex-direction:column}article small{color:#465e56}article h3{margin:12px 0 0}article p{flex:1}button{cursor:pointer;font:inherit;font-weight:600;color:#155347;border:1px solid #b0c9be;border-radius:7px;background:#edf6f1;padding:7px 12px;align-self:start}#count{font-weight:600}</style><header><h1>Atelier de prompturi</h1><p>7 funcții · 42 de categorii · Companie de producție cu 200 de angajați</p></header><main><section><label>Funcție<select id="role"></select></label><label>Categorie<select id="cat"></select></label><label>Utilizare<select id="kind"><option value="">Toate utilizările</option><option>Decizie strategică</option><option>Activitate curentă</option></select></label><label>Caută un prompt<input id="q" type="search" placeholder="Ex. stoc, client, utilaj"></label></section><p id="count" aria-live="polite"></p><div id="grid"></div></main><script>const data=[{"role":"🏢 Director general","name":"🧭 Planificare strategică","p":"Compară [direcțiile de creștere] pe baza marjei, cererii și capacității. Recomandă două priorități pe trei ani și un indicator pentru fiecare.","type":"Decizie strategică"},{"role":"🏢 Director general","name":"⚖️ Compararea investițiilor","p":"Selectează din [proiecte] combinația care încape în [buget]. Compară beneficiul, riscul și costul amânării.","type":"Decizie strategică"},{"role":"🏢 Director general","name":"🌦️ Simulare de scenarii","p":"Simulează pierderea [clientului principal] folosind [venituri și costuri]. Propune două răspunsuri și pragurile de activare.","type":"Decizie strategică"},{"role":"🏢 Director general","name":"📊 Sinteză managerială","p":"Compară [rezultatele săptămânii] cu [țintele]. Rezumă în 120 de cuvinte abaterile, impactul și deciziile necesare.","type":"Activitate curentă"},{"role":"🏢 Director general","name":"🤝 Coordonare interdepartamentală","p":"Din [rapoartele de schimb], identifică trei blocaje între echipe. Pregătește agenda unei ședințe de 15 minute.","type":"Activitate curentă"},{"role":"🏢 Director general","name":"📌 Urmărirea deciziilor","p":"Compară [minuta] cu [actualizările]. Listează acțiunea, responsabilul, termenul și dovada finalizării.","type":"Activitate curentă"},{"role":"📈 Manager vânzări","name":"🎯 Segmentarea clienților","p":"Compară [segmentele B2B] după marjă, volum și ore de producție. Alege două segmente prioritare pentru anul viitor.","type":"Decizie strategică"},{"role":"📈 Manager vânzări","name":"🔮 Prognoza vânzărilor","p":"Din [comenzi ferme] și [oportunități cu probabilități], estimează vânzările lunare pe familie de produse. Evidențiază ipotezele sensibile.","type":"Decizie strategică"},{"role":"📈 Manager vânzări","name":"🏷️ Politica de preț","p":"Analizează [ofertele câștigate și pierdute]. Propune praguri de discount pe volum și estimează efectul asupra marjei.","type":"Decizie strategică"},{"role":"📈 Manager vânzări","name":"📝 Ofertare","p":"Din [cerere], [prețuri] și [disponibil], redactează o ofertă cu produs, cantitate, preț și termen. Marchează condițiile care cer aprobare.","type":"Activitate curentă"},{"role":"📈 Manager vânzări","name":"🗣️ Pregătirea negocierilor","p":"Folosește [istoricul clientului] și [limitele comerciale]. Pregătește trei obiecții probabile, răspunsuri și concesii condiționate.","type":"Activitate curentă"},{"role":"📈 Manager vânzări","name":"📨 Comunicare cu clienții","p":"Compară [termenul promis] cu [planul actual]. Scrie o actualizare pentru client distingând datele confirmate de estimări.","type":"Activitate curentă"},{"role":"💰 Financiar","name":"🧮 Bugetare și prognoză","p":"Revizuiește [bugetul] folosind [rezultatele] și [prognoza comenzilor]. Arată impactul pe trimestre și ipotezele principale.","type":"Decizie strategică"},{"role":"💰 Financiar","name":"📉 Analiza profitabilității","p":"Din [vânzări și costuri], calculează marja pe familie de produse. Explică principalele diferențe și ce date trebuie verificate.","type":"Decizie strategică"},{"role":"💰 Financiar","name":"🏦 Evaluarea investițiilor","p":"Compară [proiectele] după cost inițial, flux anual de numerar și perioada de recuperare. Testează scenariul unei cereri mai mici.","type":"Decizie strategică"},{"role":"💰 Financiar","name":"💧 Monitorizarea lichidității","p":"Din [sold], [încasări] și [plăți], estimează disponibilul zilnic pe monedă și semnalează coborârea sub [rezerva minimă].","type":"Activitate curentă"},{"role":"💰 Financiar","name":"🔍 Reconciliere","p":"Compară [stocul scriptic] cu [inventarul fizic] la aceeași dată. Calculează diferențele în bucăți și lei și cere documentele justificative.","type":"Activitate curentă"},{"role":"💰 Financiar","name":"📋 Raportare financiară","p":"Compară [execuția lunară] cu [bugetul]. Prezintă cele mai mari trei abateri în lei și procente, cu explicațiile documentate.","type":"Activitate curentă"},{"role":"⚖️ Juridic","name":"🛡️ Evaluarea riscului contractual","p":"Compară [contractul] cu [limitele aprobate]. Citează clauzele privind garanțiile și răspunderea, apoi ordonează riscurile după impact.","type":"Decizie strategică"},{"role":"⚖️ Juridic","name":"🤝 Strategie de negociere","p":"Folosind [proiectul de acord] și [mandatul intern], propune poziția inițială, concesiile acceptabile și punctele de escaladat.","type":"Decizie strategică"},{"role":"⚖️ Juridic","name":"🧩 Impactul reglementărilor","p":"Compară [textul reglementării] cu [procesele companiei]. Indică articolul relevant, echipa afectată și întrebările pentru validare juridică.","type":"Decizie strategică"},{"role":"⚖️ Juridic","name":"🔎 Revizuirea documentelor","p":"Compară [proiectul primit] cu [modelul aprobat]. Prezintă într-un tabel articolul, modificarea și consecința practică.","type":"Activitate curentă"},{"role":"⚖️ Juridic","name":"🗓️ Monitorizarea obligațiilor","p":"Extrage din [contracte] termenele din următoarele 30 de zile. Indică articolul-sursă, data și acțiunea necesară.","type":"Activitate curentă"},{"role":"⚖️ Juridic","name":"✉️ Redactarea corespondenței","p":"Pe baza [reclamației], [contractului] și [documentelor livrării], redactează un răspuns pentru revizuire. Marchează faptele de verificat.","type":"Activitate curentă"},{"role":"👥 Resurse umane","name":"🧑‍🏭 Planificarea personalului","p":"Compară [necesarul pe schimb] cu [efectivele și calificările]. Estimează deficitul trimestrial și compară redistribuirea cu recrutarea.","type":"Decizie strategică"},{"role":"👥 Resurse umane","name":"🎓 Dezvoltarea competențelor","p":"Din [matricea competențelor] și [planul tehnologic], propune priorități de formare și probe practice de evaluare.","type":"Decizie strategică"},{"role":"👥 Resurse umane","name":"🔄 Analiza retenției","p":"Analizează [plecările agregate pe rol și vechime]. Propune două ipoteze verificabile și un pilot de retenție cu indicator la șase luni.","type":"Decizie strategică"},{"role":"👥 Resurse umane","name":"📣 Recrutare","p":"Din [fișa postului] și [condițiile de lucru], scrie un anunț clar și cinci întrebări de interviu legate de cerințele rolului.","type":"Activitate curentă"},{"role":"👥 Resurse umane","name":"👋 Integrarea angajaților","p":"Folosind [rolul], [schimbul] și [procedura], creează programul primei săptămâni cu responsabil și verificare pentru fiecare activitate.","type":"Activitate curentă"},{"role":"👥 Resurse umane","name":"📅 Organizarea schimburilor","p":"Compară [absențele], [disponibilitatea] și [calificările]. Propune acoperirea posturilor respectând [regulile de programare].","type":"Activitate curentă"},{"role":"🏭 Manager de producție","name":"⚙️ Planificarea capacității","p":"Pentru [prognoza pe doi ani], compară un schimb suplimentar, subcontractarea și un utilaj nou. Indică volumele care justifică fiecare variantă.","type":"Decizie strategică"},{"role":"🏭 Manager de producție","name":"⏱️ Analiza productivității","p":"Din [timpii de ciclu și reglaj] și [volume], identifică operația care limitează debitul. Propune două îmbunătățiri măsurabile.","type":"Decizie strategică"},{"role":"🏭 Manager de producție","name":"🛠️ Planificarea mentenanței","p":"Din [istoricul opririlor] și [costul orei pierdute], prioritizează utilajele și compară două programe de mentenanță.","type":"Decizie strategică"},{"role":"🏭 Manager de producție","name":"🗂️ Programarea loturilor","p":"Ordonează [loturile] după termene, disponibilul materialelor și capacitate. Indică succesiunea și loturile blocate.","type":"Activitate curentă"},{"role":"🏭 Manager de producție","name":"🔀 Replanificare","p":"Linia [X] se oprește pentru [durată]. Compară două planuri folosind [lucrările în curs] și [utilajele compatibile]. Indică întârzierile pe comandă.","type":"Activitate curentă"},{"role":"🏭 Manager de producție","name":"📒 Predarea schimbului","p":"Transformă [jurnalul operatorilor] într-o fișă cu loturi în lucru, cantități, opriri și prima verificare a schimbului următor.","type":"Activitate curentă"},{"role":"✅ Manager al calității","name":"💸 Costul noncalității","p":"Din [rebuturi, remedieri și retururi], estimează pierderea anuală pe defect și selectează proiectul cu cel mai mare potențial de reducere.","type":"Decizie strategică"},{"role":"✅ Manager al calității","name":"🏷️ Evaluarea furnizorilor","p":"Clasifică [furnizorii] după gravitatea și recurența defectelor și impactul opririlor. Propune prioritățile de audit.","type":"Decizie strategică"},{"role":"✅ Manager al calității","name":"🛡️ Prevenirea defectelor","p":"Corelează [defectele istorice] cu [etapele procesului]. Recomandă controale preventive și dovezi pentru verificarea eficacității.","type":"Decizie strategică"},{"role":"✅ Manager al calității","name":"🔬 Control la recepție","p":"Compară [măsurătorile] cu [toleranțele aprobate]. Listează abaterile pe lot și punctele care cer decizia inspectorului.","type":"Activitate curentă"},{"role":"✅ Manager al calității","name":"🚧 Gestionarea neconformităților","p":"Din [fișa defectului] și [trasabilitate], identifică loturile posibil afectate și pregătește fișa de izolare cu locații și cantități.","type":"Activitate curentă"},{"role":"✅ Manager al calității","name":"🧪 Verificarea acțiunilor corective","p":"Compară [registrul neconformităților] cu [dovezile]. Indică acțiunile restante, verificările de eficacitate și defectele reapărute.","type":"Activitate curentă"},{"role":"🏭 Manager de producție","name":"🔀 Replanificare","p":"Materia primă pentru [lot] întârzie [durată]. Folosește [stocurile] și [planul] pentru a compara două succesiuni și termenele rezultate.","type":"Activitate curentă"},{"role":"🏭 Manager de producție","name":"🔀 Replanificare","p":"Introdu [comanda urgentă] în [planul de producție]. Compară două poziții în secvență și arată comenzile afectate, orele suplimentare și decizia necesară.","type":"Activitate curentă"}];const el=id=>document.getElementById(id),role=el('role'),cat=el('cat'),kind=el('kind'),q=el('q'),grid=el('grid');function options(s,all,values){s.replaceChildren(new Option(all,''));for(const v of new Set(values))s.add(new Option(v,v))}options(role,'Toate funcțiile',data.map(x=>x.role));function categories(){options(cat,'Toate categoriile',data.filter(x=>!role.value||x.role===role.value).map(x=>x.name))}function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function render(){const found=data.filter(x=>(!role.value||x.role===role.value)&&(!cat.value||x.name===cat.value)&&(!kind.value||x.type===kind.value)&&norm(Object.values(x).join(' ')).includes(norm(q.value.trim())));el('count').textContent=found.length?found.length+' '+(found.length===1?'prompt disponibil':'prompturi disponibile'):'Niciun rezultat. Modifică filtrele sau căutarea.';grid.replaceChildren();for(const x of found){const a=document.createElement('article');a.innerHTML='<small></small><h3></h3><p></p><button>Copiază promptul</button>';a.children[0].textContent=x.role+' · '+x.type;a.children[1].textContent=x.name;a.children[2].textContent=x.p;a.lastChild.onclick=async()=>{try{await navigator.clipboard.writeText(x.p);a.lastChild.textContent='Copiat ✓'}catch{const r=document.createRange();r.selectNodeContents(a.children[2]);getSelection().removeAllRanges();getSelection().addRange(r);a.lastChild.textContent='Text selectat pentru copiere'}};grid.append(a)}}role.onchange=()=>{categories();render()};cat.onchange=kind.onchange=q.oninput=render;categories();render()</script></html>
